name: Generate Supabase Seed Migration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generateSupabaseSeed.ts'
      - '.github/workflows/generate-supabase-seed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate deterministic Supabase seed migration
        run: npm exec -- tsx scripts/generateSupabaseSeed.ts

      - name: Validate generated migration exists
        run: test -s supabase/migrations/20261014020000_seed_sentinalbrand_dataset.sql

      - name: Run regression tests
        run: npm test

      - name: Commit generated migration
        run: |
          if git diff --quiet -- supabase/migrations/20261014020000_seed_sentinalbrand_dataset.sql && git ls-files --error-unmatch supabase/migrations/20261014020000_seed_sentinalbrand_dataset.sql >/dev/null 2>&1; then
            echo "Seed migration is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20261014020000_seed_sentinalbrand_dataset.sql
          git commit -m "feat(supabase): seed SentinalBrand prototype dataset"
          git push origin HEAD:main
